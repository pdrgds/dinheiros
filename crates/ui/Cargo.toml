[package]
name = "dinheiros-ui"
description = "Desktop GUI for Dinheiros — a local-first investment portfolio tracker for Brazilian and international assets."
keywords = ["finance", "portfolio", "gpui", "desktop"]
categories = ["finance", "gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[[bin]]
name = "dinheiros"
path = "src/main.rs"

[dependencies]
dinheiros-core = { path = "../core" }
# gpui is unpublished; we depend on it via git. We deliberately do NOT pin a `rev`
# here because `gpui-component` (below) also pulls `gpui` from this same git URL
# without a rev — adding a rev would create two parallel sources of `gpui` and
# break the build with trait-bound mismatches. The commit is pinned via Cargo.lock
# instead; CI runs with `--locked` to enforce it.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "564f9fa83145ac8439989242e203471ac86dad11" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "564f9fa83145ac8439989242e203471ac86dad11" }
dirs = "5"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
